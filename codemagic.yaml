workflows:
  ka-bijoux-signing-diagnostic:
    name: KA Bijoux - signing read only
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      groups:
        - ka_bijoux_apple
    scripts:
      - name: Check Apple bundle API and fetch existing signing files
        script: |
          set -euo pipefail
          : "${CERTIFICATE_PRIVATE_KEY:?Certificate signing key is unavailable}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/certs" "$work/profiles"
          app-store-connect fetch-signing-files com.kabijoux.app --strict-match-identifier --type IOS_APP_STORE --certificates-dir "$work/certs" --profiles-dir "$work/profiles"
          echo "Apple bundle and signing file fetch: OK"
          export SIGNING_DIAG_DIR="$work"
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import plistlib
          import subprocess

          def cmd(*args, data=None):
              return subprocess.run(args, input=data, capture_output=True, check=True).stdout

          work = pathlib.Path(os.environ["SIGNING_DIAG_DIR"])
          key = cmd("openssl", "pkey", "-pubout", "-outform", "DER", data=os.environ["CERTIFICATE_PRIVATE_KEY"].encode())
          profiles = list((work / "profiles").glob("*.mobileprovision"))
          for path in profiles:
              profile = plistlib.loads(cmd("security", "cms", "-D", "-i", str(path)))
              ent = profile["Entitlements"]
              expires = profile["ExpirationDate"].replace(tzinfo=datetime.timezone.utc)
              app_ids = {prefix + ".com.kabijoux.app" for prefix in profile.get("ApplicationIdentifierPrefix", [])}
              matching = False
              for cert in profile.get("DeveloperCertificates", []):
                  try:
                      cmd("openssl", "x509", "-inform", "DER", "-checkend", "0", "-noout", data=cert)
                      public = cmd("openssl", "x509", "-inform", "DER", "-pubkey", "-noout", data=cert)
                      if cmd("openssl", "pkey", "-pubin", "-outform", "DER", data=public) == key:
                          matching = True
                          break
                  except subprocess.CalledProcessError:
                      continue
              if (expires > datetime.datetime.now(datetime.timezone.utc)
                      and ent.get("application-identifier") in app_ids
                      and "Default" in ent.get("com.apple.developer.applesignin", [])
                      and not ent.get("get-task-allow")
                      and matching):
                  print("Distribution certificate and private key: OK")
                  print(f"App Store provisioning profile, bundle, certificate and Apple sign-in: OK (expires {expires.date()})")
                  break
          else:
              raise SystemExit("No unexpired App Store profile matches the bundle, certificate and Apple sign-in entitlement")
          PY
