workflows:
  ka-bijoux-ios-release:
    name: KA Bijoux iOS 1.0 (9) - signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        # Create this Codemagic group for KA Bijoux only. Required variables:
        # EXPO_PUBLIC_API_URL, EXPO_PUBLIC_SITE_URL, EXPO_PUBLIC_SUPABASE_URL,
        # EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY, EXPO_PUBLIC_AUTH_GOOGLE_ENABLED.
        - ka_bijoux_mobile
        # KA Bijoux-only App Store Connect credentials and the fresh
        # distribution certificate private key. All values are secrets.
        - ka_bijoux_apple
      vars:
        BUNDLE_ID: com.kabijoux.app
        APPLE_TEAM_ID: YF8JRZUL75
        APPLICATION_IDENTIFIER: YF8JRZUL75.com.kabijoux.app
        MARKETING_VERSION: "1.0"
        BUILD_NUMBER: "9"
        IOS_DEPLOYMENT_TARGET: "15.0"
        XCODE_WORKSPACE: KABijoux.xcworkspace
        XCODE_SCHEME: KABijoux
      node: 20.19.4
      # Xcode 26 is required for App Store uploads from April 2026 onward.
      # expo-device 6.0.2 receives its Swift compatibility patch at postinstall.
      xcode: 26.4
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/mobile/node_modules
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Confirm KA Bijoux repository and immutable release identity
        script: |
          set -euo pipefail
          test "$CM_BUILD_DIR" != ""
          cd "$CM_BUILD_DIR"
          remote="$(git remote get-url origin)"
          case "$remote" in
            https://github.com/elitemodeell/ka-bijoux|\
            https://github.com/elitemodeell/ka-bijoux.git|\
            https://*@github.com/elitemodeell/ka-bijoux|\
            https://*@github.com/elitemodeell/ka-bijoux.git|\
            git@github.com:elitemodeell/ka-bijoux.git) ;;
            *) echo "Unexpected Git remote: $remote" >&2; exit 1 ;;
          esac
          test "$BUNDLE_ID" = "com.kabijoux.app"
          node - <<'NODE'
          const config = require('./mobile/app.json').expo;
          if (config.name !== 'KA Bijoux') throw new Error('Unexpected application name');
          if (config.ios.bundleIdentifier !== 'com.kabijoux.app') throw new Error('Unexpected bundle identifier');
          if (config.version !== '1.0') throw new Error(`Expected version 1.0, received ${config.version}`);
          if (config.ios.buildNumber !== '9') throw new Error(`Expected build 9, received ${config.ios.buildNumber}`);
          const buildProperties = config.plugins.find(plugin => Array.isArray(plugin) && plugin[0] === 'expo-build-properties');
          if (buildProperties?.[1]?.ios?.deploymentTarget !== '15.0') throw new Error('Expected iOS deployment target 15.0');
          if (config.ios.usesAppleSignIn !== true) throw new Error('usesAppleSignIn must be true');
          if (config.ios.supportsTablet !== true) throw new Error('iPad support must remain enabled');
          NODE

      - name: Reject exposed secrets and enforce KA Bijoux allowlist
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          forbidden="$(git ls-files | grep -E '(\.p8$|\.p12$|\.pem$|\.key$|\.cer$|\.pfx$|\.mobileprovision$|\.provisionprofile$|(^|/)\.env$|google-service-account\.json$)' || true)"
          if [ -n "$forbidden" ]; then
            echo "Sensitive files are tracked:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
          if git grep -I -n -E "(SUPABASE_SERVICE_ROLE_KEY|APP_STORE_CONNECT_PRIVATE_KEY|APPLE_.*SECRET|JWT_SECRET|PRIVATE_KEY|ACCESS_TOKEN|API_TOKEN)[[:space:]]*=[[:space:]]*[\"'][^\"']+[\"']" -- ':!*.md' ':!*.example' ':!package-lock.json' ':!mobile/package-lock.json'; then
            echo "Possible plaintext secret detected" >&2
            exit 1
          fi
          if git grep -I -n -E -- '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----' ':!*.md' ':!*.example'; then
            echo "Versioned private key detected" >&2
            exit 1
          fi
          test "$BUNDLE_ID" = "com.kabijoux.app"
          test "$APPLE_TEAM_ID" = "YF8JRZUL75"
          test "$APPLICATION_IDENTIFIER" = "YF8JRZUL75.com.kabijoux.app"
          test "$MARKETING_VERSION" = "1.0"
          test "$BUILD_NUMBER" = "9"
          test "$IOS_DEPLOYMENT_TARGET" = "15.0"

      - name: Validate required mobile environment
        script: |
          set -euo pipefail
          : "${EXPO_PUBLIC_API_URL:?Missing EXPO_PUBLIC_API_URL in ka_bijoux_mobile}"
          : "${EXPO_PUBLIC_SITE_URL:?Missing EXPO_PUBLIC_SITE_URL in ka_bijoux_mobile}"
          : "${EXPO_PUBLIC_SUPABASE_URL:?Missing EXPO_PUBLIC_SUPABASE_URL in ka_bijoux_mobile}"
          : "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY in ka_bijoux_mobile}"
          test "$EXPO_PUBLIC_API_URL" = "https://kabijoux.com.br"
          test "$EXPO_PUBLIC_SITE_URL" = "https://kabijoux.com.br"

      - name: Install JavaScript dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npm ci --prefix backend --workspaces=false
          npm ci --prefix mobile --legacy-peer-deps

      - name: quality_auth - TypeScript, lint applicability and auth UI
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npm --prefix mobile run typecheck
          npm --prefix mobile run test:auth-ui
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const mobile = require('./mobile/package.json');
          if (mobile.scripts?.lint) execFileSync('npm', ['--prefix', 'mobile', 'run', 'lint'], { stdio: 'inherit' });
          else console.log('Mobile lint: N/A — origin/main has no lint script or ESLint configuration.');
          NODE

      - name: backend_regression - TypeScript, Prisma and complete backend suite
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npm --prefix backend run typecheck
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/postgres' \
          DIRECT_URL='postgresql://postgres:postgres@localhost:5432/postgres' \
            npm --prefix backend exec -- prisma validate \
              --schema="$CM_BUILD_DIR/backend/prisma/schema.prisma"
          npm --prefix backend test -- --run
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const backend = require('./backend/package.json');
          if (backend.scripts?.lint) execFileSync('npm', ['--workspace=backend', 'run', 'lint'], { stdio: 'inherit' });
          else console.log('Backend lint: N/A — origin/main has no lint script or ESLint configuration.');
          NODE

      - name: Validate Apple backend contract
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f backend/app/api/auth/apple/complete/route.ts
          grep -q 'getSupabaseUser(accessToken)' backend/app/api/auth/apple/complete/route.ts
          grep -q 'completeAppleCustomerLink' backend/app/api/auth/apple/complete/route.ts
          grep -q 'provider: "apple"' backend/app/api/auth/apple/complete/route.ts
          grep -q '/api/auth/apple/complete' mobile/services/appleAuth.ts
          grep -q 'router.replace("/(tabs)")' 'mobile/app/(auth)/login.tsx'
          grep -q 'router.replace("/(tabs)")' 'mobile/app/(auth)/cadastro.tsx'
          status="$(curl -sS -o /tmp/apple-endpoint.json -w '%{http_code}' -X POST https://kabijoux.com.br/api/auth/apple/complete -H 'Content-Type: application/json' -d '{}')"
          if [ "$status" != "401" ]; then
            echo "Production Apple endpoint is not active (expected 401 without token, got $status). Deploy ka-bijoux-backend first." >&2
            cat /tmp/apple-endpoint.json || true
            exit 1
          fi

      - name: Create fresh KA Bijoux App Store signing files
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Generate native iOS project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install --repo-update

      - name: Validate generated iOS capability, version and App Icon
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          fail() { echo "iOS validation failed: $1" >&2; exit 1; }
          workspace="ios/$XCODE_WORKSPACE"
          test -d "$workspace" || fail "workspace $workspace not found"
          entitlements="$(find ios -name '*.entitlements' -type f | head -1)"
          test -n "$entitlements" || fail "entitlements file not found"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin' "$entitlements" | grep -q 'Default' || fail "Sign in with Apple entitlement missing"
          grep -R -q 'PRODUCT_BUNDLE_IDENTIFIER = com.kabijoux.app' ios || fail "bundle identifier mismatch"
          grep -R -q 'MARKETING_VERSION = 1.0' ios || fail "marketing version mismatch"
          grep -R -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' ios || fail "deployment target mismatch"
          app_info="$(find ios -path '*/Pods' -prune -o -name 'Info.plist' -type f -print | head -1)"
          test -n "$app_info" || fail "application Info.plist not found"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_info")" = "$BUILD_NUMBER" || fail "build number mismatch"
          icon_json="$(find ios -path '*AppIcon.appiconset/Contents.json' -type f | head -1)"
          test -n "$icon_json" || fail "AppIcon Contents.json not found"
          node - "$icon_json" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = process.argv[2];
          const json = JSON.parse(fs.readFileSync(file, 'utf8'));
          const named = json.images.filter(x => x.filename);
          if (!named.length) throw new Error('App Icon set has no generated images');
          for (const image of named) {
            if (!fs.existsSync(path.join(path.dirname(file), image.filename))) throw new Error(`Missing App Icon ${image.filename}`);
          }
          NODE

      - name: Apply KA Bijoux App Store signing profile
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          keychain add-certificates
          xcode-project use-profiles
          profile_ok=0
          for profile in \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$profile" ] || continue
            if grep -a -q 'com.kabijoux.app' "$profile" && \
               grep -a -q 'com.apple.developer.applesignin' "$profile" && \
               grep -a -q 'Default' "$profile"; then
              echo "Validated KA Bijoux profile: $(basename "$profile")"
              profile_ok=1
              break
            fi
          done
          test "$profile_ok" = 1

      - name: Build signed Release Archive and IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Validate signed IPA identity and entitlements
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          fail() { echo "Signed IPA validation failed: $1" >&2; exit 1; }
          ipa="$(find build/ios/ipa -name '*.ipa' -type f | head -1)"
          test -n "$ipa" || fail "IPA not found"
          rm -rf /tmp/ka-bijoux-ipa
          mkdir -p /tmp/ka-bijoux-ipa
          unzip -q "$ipa" -d /tmp/ka-bijoux-ipa
          app_count="$(find /tmp/ka-bijoux-ipa/Payload -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')"
          test "$app_count" = "1" || fail "expected exactly one application bundle, found $app_count"
          app="/tmp/ka-bijoux-ipa/Payload/KABijoux.app"
          test -d "$app" || fail "allowlisted KABijoux.app not found"
          info="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "$BUNDLE_ID" || fail "bundle identifier mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$MARKETING_VERSION" || fail "marketing version mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "$BUILD_NUMBER" || fail "build number mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$info")" = "$IOS_DEPLOYMENT_TARGET" || fail "minimum iOS version mismatch"
          codesign --verify --deep --strict --verbose=2 "$app" || fail "invalid code signature"
          signature="$(codesign -dvvv "$app" 2>&1)"
          printf '%s\n' "$signature" | grep -q "^Authority=Apple Distribution: .* ($APPLE_TEAM_ID)$" || fail "unexpected signing certificate"
          printf '%s\n' "$signature" | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" || fail "code-signing Team ID mismatch"
          codesign -d --entitlements :- "$app" > /tmp/ka-bijoux-entitlements.plist
          entitlements=/tmp/ka-bijoux-entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements")" = "$APPLICATION_IDENTIFIER" || fail "application-identifier mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$entitlements")" = "$APPLE_TEAM_ID" || fail "entitlement Team ID mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$entitlements")" = "false" || fail "get-task-allow must be false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$entitlements")" = "production" || fail "aps-environment must be production"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin' "$entitlements" | grep -q 'Default' || fail "Sign in with Apple entitlement mismatch"
          profile="$app/embedded.mobileprovision"
          test -f "$profile" || fail "embedded provisioning profile not found"
          security cms -D -i "$profile" > /tmp/ka-bijoux-profile.plist
          profile_plist=/tmp/ka-bijoux-profile.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")" = "$APPLE_TEAM_ID" || fail "profile Team ID mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")" = "$APPLICATION_IDENTIFIER" || fail "profile application-identifier mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")" = "false" || fail "profile is not App Store distribution"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then fail "development/ad hoc profile is not allowed"; fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" >/dev/null 2>&1; then fail "enterprise profile is not allowed"; fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist")" = "production" || fail "profile push environment mismatch"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$profile_plist" | grep -q 'Default' || fail "profile Apple entitlement mismatch"
          test -f "$app/Assets.car" || fail "compiled App Icon asset catalog not found"
          cp /tmp/ka-bijoux-entitlements.plist "build/ios/ipa/KA-Bijoux-build-${BUILD_NUMBER}-entitlements.plist"
          cp "$app/embedded.mobileprovision" "build/ios/ipa/KA-Bijoux-build-${BUILD_NUMBER}.mobileprovision"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.plist
      - mobile/build/ios/ipa/*.mobileprovision
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # Intentionally no publishing block. The IPA must not be uploaded to
    # App Store Connect or TestFlight without explicit user authorization.

  ka-bijoux-testflight-upload-build-9:
    name: KA Bijoux 1.0 (9) - upload existing IPA to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      groups:
        - ka_bijoux_apple
      vars:
        BUNDLE_ID: com.kabijoux.app
        APPLE_TEAM_ID: YF8JRZUL75
        APPLICATION_IDENTIFIER: YF8JRZUL75.com.kabijoux.app
        MARKETING_VERSION: "1.0"
        BUILD_NUMBER: "9"
        IOS_DEPLOYMENT_TARGET: "15.0"
      xcode: 26.4

    scripts:
      - name: Download exact immutable Codemagic build artifact
        script: |
          set -euo pipefail
          : "${KA_BIJOUX_IPA_URL:?Missing ephemeral artifact URL}"
          : "${SOURCE_CODEMAGIC_BUILD_ID:?Missing source Codemagic build ID}"
          : "${EXPECTED_IPA_SHA256:?Missing expected IPA SHA-256}"
          mkdir -p "$CM_BUILD_DIR/testflight-upload"
          curl --fail --location --silent --show-error \
            "$KA_BIJOUX_IPA_URL" \
            --output "$CM_BUILD_DIR/testflight-upload/KABijoux.ipa"
          echo "$EXPECTED_IPA_SHA256  $CM_BUILD_DIR/testflight-upload/KABijoux.ipa" | shasum -a 256 --check

      - name: Confirm KA Bijoux identity, signature and Apple entitlement
        script: |
          set -euo pipefail
          fail() { echo "TestFlight IPA validation failed: $1" >&2; exit 1; }
          ipa="$CM_BUILD_DIR/testflight-upload/KABijoux.ipa"
          payload="$CM_BUILD_DIR/testflight-upload/validated"
          mkdir -p "$payload"
          unzip -q "$ipa" -d "$payload"
          app_count="$(find "$payload/Payload" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')"
          test "$app_count" = "1" || fail "expected exactly one application bundle, found $app_count"
          app="$payload/Payload/KABijoux.app"
          test -d "$app" || fail "allowlisted KABijoux.app not found"
          info="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "$BUNDLE_ID" || fail "bundle identifier mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$MARKETING_VERSION" || fail "marketing version mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "$BUILD_NUMBER" || fail "build number mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$info")" = "$IOS_DEPLOYMENT_TARGET" || fail "minimum iOS version mismatch"
          codesign --verify --deep --strict --verbose=2 "$app" || fail "invalid code signature"
          signature="$(codesign -dvvv "$app" 2>&1)"
          printf '%s\n' "$signature" | grep -q "^Authority=Apple Distribution: .* ($APPLE_TEAM_ID)$" || fail "unexpected signing certificate"
          printf '%s\n' "$signature" | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" || fail "code-signing Team ID mismatch"
          codesign -d --entitlements :- "$app" > "$CM_BUILD_DIR/testflight-upload/entitlements.plist"
          entitlements="$CM_BUILD_DIR/testflight-upload/entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements")" = "$APPLICATION_IDENTIFIER" || fail "application-identifier mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$entitlements")" = "$APPLE_TEAM_ID" || fail "entitlement Team ID mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$entitlements")" = "false" || fail "get-task-allow must be false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$entitlements")" = "production" || fail "aps-environment must be production"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin' "$entitlements" | grep -q 'Default' || fail "Sign in with Apple entitlement mismatch"
          profile="$app/embedded.mobileprovision"
          test -f "$profile" || fail "embedded provisioning profile not found"
          security cms -D -i "$profile" > "$CM_BUILD_DIR/testflight-upload/profile.plist"
          profile_plist="$CM_BUILD_DIR/testflight-upload/profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")" = "$APPLE_TEAM_ID" || fail "profile Team ID mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")" = "$APPLICATION_IDENTIFIER" || fail "profile application-identifier mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")" = "false" || fail "profile is not App Store distribution"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then fail "development/ad hoc profile is not allowed"; fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" >/dev/null 2>&1; then fail "enterprise profile is not allowed"; fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist")" = "production" || fail "profile push environment mismatch"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$profile_plist" | grep -q 'Default' || fail "profile Apple entitlement mismatch"
          echo "Validated KA Bijoux $MARKETING_VERSION ($BUILD_NUMBER), bundle $BUNDLE_ID, source build $SOURCE_CODEMAGIC_BUILD_ID"

    artifacts:
      - testflight-upload/KABijoux.ipa
      - testflight-upload/entitlements.plist
      - testflight-upload/profile.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload only. No TestFlight beta review and no App Store review.
