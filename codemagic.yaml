workflows:
  ka-bijoux-ios-release:
    name: KA Bijoux iOS 1.1.1 - App Store público
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ka-bijoux-release-*"
          include: true
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        # Create this Codemagic group for KA Bijoux only. Required variables:
        # EXPO_PUBLIC_API_URL, EXPO_PUBLIC_SITE_URL, EXPO_PUBLIC_SUPABASE_URL,
        # EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY, EXPO_PUBLIC_AUTH_GOOGLE_ENABLED.
        - ka_bijoux_mobile
        - ka_bijoux_apple
      vars:
        BUNDLE_ID: com.kabijoux.app
        MARKETING_VERSION: "1.1.1"
        BUILD_NUMBER: "37"
        APP_STORE_APPLE_ID: "6798015933"
        XCODE_WORKSPACE: KABijoux.xcworkspace
        XCODE_SCHEME: KABijoux
      node: 20.19.4
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/mobile/node_modules
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Confirm KA Bijoux repository and immutable release identity
        script: |
          set -euo pipefail
          test "$CM_BUILD_DIR" != ""
          cd "$CM_BUILD_DIR"
          remote="$(git remote get-url origin)"
          case "$remote" in
            *github.com/elitemodeell/ka-bijoux|*github.com/elitemodeell/ka-bijoux.git) ;;
            *) echo "Unexpected Git remote: $remote" >&2; exit 1 ;;
          esac
          test "$BUNDLE_ID" = "com.kabijoux.app"
          node - <<'NODE'
          const config = require('./mobile/app.json').expo;
          if (config.name !== 'KA Bijoux') throw new Error('Unexpected application name');
          if (config.ios.bundleIdentifier !== 'com.kabijoux.app') throw new Error('Unexpected bundle identifier');
          if (config.version !== process.env.MARKETING_VERSION) throw new Error(`Unexpected Expo version: ${config.version}`);
          if (config.ios.buildNumber !== process.env.BUILD_NUMBER) throw new Error(`Unexpected Expo build: ${config.ios.buildNumber}`);
          if (config.ios.usesAppleSignIn !== true) throw new Error('usesAppleSignIn must be true');
          if (config.ios.supportsTablet !== true) throw new Error('iPad support must remain enabled');
          NODE

      - name: Reject exposed secrets and foreign signing files
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          forbidden="$(git ls-files | grep -E '(\.p8$|\.p12$|\.mobileprovision$|(^|/)\.env$|google-service-account\.json$)' || true)"
          if [ -n "$forbidden" ]; then
            echo "Sensitive files are tracked:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
          if git grep -I -l -E '(\$aact_(prod|hmlg)_[[:alnum:]_-]{20,}|-----BEGIN (EC |RSA )?PRIVATE KEY-----)' -- ':!*.md' ':!*.example' ':!package-lock.json' ':!mobile/package-lock.json'; then
            echo "Possible embedded financial key or private key detected" >&2
            exit 1
          fi
          if git grep -I -n -i 'zuno' -- mobile/app.json mobile/eas.json; then
            echo "Foreign project reference detected" >&2
            exit 1
          fi

      - name: Validate required mobile environment
        script: |
          set -euo pipefail
          : "${EXPO_PUBLIC_API_URL:?Missing EXPO_PUBLIC_API_URL in ka_bijoux_mobile}"
          : "${EXPO_PUBLIC_SITE_URL:?Missing EXPO_PUBLIC_SITE_URL in ka_bijoux_mobile}"
          : "${EXPO_PUBLIC_SUPABASE_URL:?Missing EXPO_PUBLIC_SUPABASE_URL in ka_bijoux_mobile}"
          : "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY in ka_bijoux_mobile}"
          test "$EXPO_PUBLIC_API_URL" = "https://kabijoux.com.br"
          test "$EXPO_PUBLIC_SITE_URL" = "https://kabijoux.com.br"

      - name: Install JavaScript dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npm ci
          npm ci --prefix mobile

      - name: Validate TypeScript and mobile regression tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npm --prefix mobile run lint
          npm --prefix mobile run typecheck
          npm --prefix mobile run test:auth-ui
          npm --prefix mobile run test:google-auth
          npm --prefix mobile run test:commerce
          npm --prefix mobile run test:privacy-permissions
          npm --prefix mobile run test:cpf-profile

      - name: Validate backend, checkout and financial regression tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/backend"
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@localhost:5432/ka_bijoux_ci}"
          export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}"
          npx prisma validate
          npx prisma generate
          npx tsc --noEmit -p tsconfig.build.json
          npm test -- --run

      - name: Check production catalog compatibility
        script: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.EXPO_PUBLIC_API_URL;
          const listingResponse = await fetch(`${base}/api/mobile/products?page=1&pageSize=1`);
          if (!listingResponse.ok) throw new Error(`Product listing API returned ${listingResponse.status}`);
          const listing = await listingResponse.json();
          const id = listing?.data?.products?.[0]?.id;
          if (!id) throw new Error("Production mobile API has no currently saleable product to validate.");
          const detailResponse = await fetch(`${base}/api/mobile/products/${encodeURIComponent(id)}`);
          if (!detailResponse.ok) throw new Error(`Product detail API returned ${detailResponse.status}`);
          const detail = await detailResponse.json();
          const product = detail?.data?.product;
          if (!product?.sku || !Array.isArray(product.images) ||
              !Array.isArray(product.variations) || !Array.isArray(product.linkedOptions) ||
              !Number.isFinite(product.stock) ||
              (product.assortedColors !== undefined && typeof product.assortedColors !== "boolean") ||
              (product.fixedColor != null && typeof product.fixedColor !== "string")) {
            throw new Error("Production catalog API is incompatible with the iOS product detail.");
          }
          console.log(`Production catalog contract OK for SKU ${product.sku}.`);
          NODE

      - name: Validate Apple backend contract
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f backend/app/api/auth/apple/complete/route.ts
          grep -q 'getSupabaseUser(accessToken)' backend/app/api/auth/apple/complete/route.ts
          grep -q 'completeAppleCustomerLink' backend/app/api/auth/apple/complete/route.ts
          grep -q 'provider: "apple"' backend/app/api/auth/apple/complete/route.ts
          grep -q '/api/auth/apple/complete' mobile/services/appleAuth.ts
          grep -q 'router.replace("/(tabs)")' 'mobile/app/(auth)/login.tsx'
          grep -q 'router.replace("/(tabs)")' 'mobile/app/(auth)/cadastro.tsx'
          status="$(curl -sS -o /tmp/apple-endpoint.json -w '%{http_code}' -X POST https://kabijoux.com.br/api/auth/apple/complete -H 'Content-Type: application/json' -d '{}')"
          if [ "$status" != "401" ]; then
            echo "Production Apple endpoint is not active (expected 401 without token, got $status)." >&2
            cat /tmp/apple-endpoint.json || true
            exit 1
          fi

      - name: Resolve the iOS build number in App Store Connect
        script: |
          set -euo pipefail
          latest="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions)"
          if [[ ! "$latest" =~ ^[0-9]+$ ]]; then
            echo "Could not verify the latest iOS build number." >&2
            exit 1
          fi
          if (( 10#$latest >= 10#$BUILD_NUMBER )); then
            BUILD_NUMBER="$((10#$latest + 1))"
          fi
          printf 'BUILD_NUMBER=%s\n' "$BUILD_NUMBER" >> "$CM_ENV"
          echo "Selected iOS build $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Generate native iOS project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          xcrun agvtool new-marketing-version "$MARKETING_VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"
          pod install --repo-update

      - name: Validate generated iOS capability, version and App Icon
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          workspace="ios/$XCODE_WORKSPACE"
          test -d "$workspace" || { echo "Missing Xcode workspace: $workspace" >&2; exit 1; }
          entitlements="$(find ios -name '*.entitlements' -type f -print -quit)"
          test -n "$entitlements" || { echo "Missing iOS entitlements file" >&2; exit 1; }
          apple_sign_in="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin' "$entitlements" 2>/dev/null || true)"
          [[ "$apple_sign_in" == *Default* ]] || { echo "Sign in with Apple entitlement is missing" >&2; exit 1; }
          build_settings="$(xcodebuild -workspace "$workspace" -scheme "$XCODE_SCHEME" -configuration Release -showBuildSettings)"
          bundle_id="$(awk -F ' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / { print $2; exit }' <<< "$build_settings")"
          info_plist="$(find ios -maxdepth 2 -name 'Info.plist' -type f -print -quit)"
          test -n "$info_plist" || { echo "Missing application Info.plist" >&2; exit 1; }
          marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          current_project_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          test "$bundle_id" = "$BUNDLE_ID" || { echo "Unexpected native bundle identifier: $bundle_id" >&2; exit 1; }
          test "$marketing_version" = "$MARKETING_VERSION" || { echo "Unexpected native marketing version: $marketing_version" >&2; exit 1; }
          test "$current_project_version" = "$BUILD_NUMBER" || { echo "Unexpected native build number: $current_project_version" >&2; exit 1; }
          icon_json="$(find ios -path '*AppIcon.appiconset/Contents.json' -type f -print -quit)"
          test -n "$icon_json" || { echo "Missing App Icon asset catalog" >&2; exit 1; }
          node - "$icon_json" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = process.argv[2];
          const json = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(json.images) || !json.images.length) throw new Error('App Icon set has no image entries');
          const named = json.images.filter(x => x.filename);
          for (const image of named) {
            if (!fs.existsSync(path.join(path.dirname(file), image.filename))) throw new Error(`Missing App Icon ${image.filename}`);
          }
          NODE

      - name: Initialize signing keychain
        script: keychain initialize

      - name: Fetch or refresh KA Bijoux App Store signing files
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --strict-match-identifier

      - name: Add signing certificate to keychain
        script: keychain add-certificates

      - name: Apply KA Bijoux App Store signing profile
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          # Use the App Store Connect distribution profile for public review.
          xcode-project use-profiles
          profile_ok=0
          for profile in \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            [ -f "$profile" ] || continue
            security cms -D -i "$profile" > /tmp/profile.plist
            app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist 2>/dev/null || true)"
            if [[ "$app_id" == *.com.kabijoux.app ]]; then
              /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' /tmp/profile.plist | grep -q 'Default'
              /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist
              /usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist
              profile_ok=1
              break
            fi
          done
          test "$profile_ok" = 1

      - name: Build signed Release Archive and IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Validate signed IPA identity and entitlements
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          ipa="$(find build/ios/ipa -name '*.ipa' -type f -print -quit)"
          test -n "$ipa"
          rm -rf /tmp/ka-bijoux-ipa
          mkdir -p /tmp/ka-bijoux-ipa
          unzip -q "$ipa" -d /tmp/ka-bijoux-ipa
          app="$(find /tmp/ka-bijoux-ipa/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app"
          info="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "$BUILD_NUMBER"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" > /tmp/ka-bijoux-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin' /tmp/ka-bijoux-entitlements.plist | grep -q 'Default'
          test -d "$app/Assets.car" -o -f "$app/Assets.car"
          cp /tmp/ka-bijoux-entitlements.plist "build/ios/ipa/KA-Bijoux-build-$BUILD_NUMBER-entitlements.plist"
          cp "$app/embedded.mobileprovision" "build/ios/ipa/KA-Bijoux-build-$BUILD_NUMBER.mobileprovision"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.plist
      - mobile/build/ios/ipa/*.mobileprovision
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # This release is for public App Store review, not an internal-only build.
        submit_to_testflight: false
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
        phased_release: false

